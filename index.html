<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập Hệ Thống Giám Sát IoT</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { margin: 0; padding: 0; background: #0f172a; font-family: 'Segoe UI', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; color: #f8fafc; }
        .auth-container { background: #1e293b; padding: 40px; border-radius: 16px; border: 1px solid #334155; width: 100%; max-width: 400px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        .auth-header { text-align: center; margin-bottom: 30px; }
        .auth-header h2 { color: #38bdf8; margin: 0; text-transform: uppercase; font-size: 22px; letter-spacing: 1px; }
        .auth-header p { color: #94a3b8; margin: 5px 0 0 0; font-size: 14px; }
        .input-group { margin-bottom: 20px; position: relative; }
        .input-group i { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: #64748b; }
        .input-group input { width: 100%; padding: 12px 15px 12px 45px; background: #0f172a; border: 1px solid #334155; border-radius: 8px; color: white; font-size: 15px; box-sizing: border-box; transition: 0.3s; }
        .input-group input:focus { border-color: #38bdf8; outline: none; }
        .auth-btn { width: 100%; padding: 12px; background: linear-gradient(135deg, #38bdf8 0%, #0284c7 100%); border: none; border-radius: 8px; color: white; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .auth-btn:hover { opacity: 0.9; transform: translateY(-1px); }
        .toggle-text { text-align: center; margin-top: 20px; font-size: 14px; color: #94a3b8; }
        .toggle-text span { color: #38bdf8; cursor: pointer; font-weight: 600; }
        .error-msg { color: #ef4444; font-size: 14px; text-align: center; margin-bottom: 15px; display: none; }
    </style>
</head>
<body>

<div class="auth-container">
    <div class="auth-header">
        <h2 id="formTitle">Hệ Thống Y Tế IoT</h2>
        <p id="formSubTitle">Vui lòng đăng nhập để vào bảng điều khiển</p>
    </div>
    
    <div class="error-msg" id="errorMsg"></div>

    <form id="authForm">
        <div class="input-group">
            <i class="fa-solid fa-envelope"></i>
            <input type="email" id="email" placeholder="Email đăng nhập..." required>
        </div>
        <div class="input-group">
            <i class="fa-solid fa-lock"></i>
            <input type="password" id="password" placeholder="Mật khẩu..." required>
        </div>
        <button type="submit" class="auth-btn" id="btnSubmit">ĐĂNG NHẬP</button>
    </form>

    <div class="toggle-text" id="toggleForm">
        Chưa có tài khoản quản lý? <span id="toggleBtn">Đăng ký ngay</span>
    </div>
</div>

<script>
    // --- ĐÃ ĐỒNG BỘ CẤU HÌNH FIREBASE CỦA ANH DƯƠNG ---
    const firebaseConfig = {
        apiKey: "AIzaSyAMuEApllbG1GIjUyKDdS2iA5aBgDXKFX0",
        authDomain: "he-thong-giam-sat-y-te.firebaseapp.com",
        projectId: "he-thong-giam-sat-y-te",
        storageBucket: "he-thong-giam-sat-y-te.firebasestorage.app",
        messagingSenderId: "364046979167",
        appId: "1:364046979167:web:30dc775a48fb4e51030bea"
    };
    firebase.initializeApp(firebaseConfig);

    const auth = firebase.auth();
    let isLoginMode = true;

    // Chuyển đổi qua lại giữa Login và Register
    document.getElementById('toggleForm').addEventListener('click', function(e) {
        if(e.target.id === 'toggleBtn') {
            isLoginMode = !isLoginMode;
            document.getElementById('errorMsg').style.display = 'none';
            if(!isLoginMode) {
                document.getElementById('formTitle').innerText = "TẠO TÀI KHOẢN MỚI";
                document.getElementById('formSubTitle').innerText = "Đăng ký tài khoản giám sát y tế";
                document.getElementById('btnSubmit').innerText = "ĐĂNG KÝ HỆ THỐNG";
                document.getElementById('toggleForm').innerHTML = "Đã có tài khoản quản trị? <span id='toggleBtn'>Đăng nhập</span>";
            } else {
                document.getElementById('formTitle').innerText = "HỆ THỐNG Y TẾ IoT";
                document.getElementById('formSubTitle').innerText = "Vui lòng đăng nhập để vào bảng điều khiển";
                document.getElementById('btnSubmit').innerText = "ĐĂNG NHẬP";
                document.getElementById('toggleForm').innerHTML = "Chưa có tài khoản quản lý? <span id='toggleBtn'>Đăng ký ngay</span>";
            }
        }
    });

    // Xử lý Submit Form
    document.getElementById('authForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const errorMsg = document.getElementById('errorMsg');

        errorMsg.style.display = 'none';

        if (isLoginMode) {
            auth.signInWithEmailAndPassword(email, password)
                .then((userCredential) => {
                    window.location.href = "dashboard.html";
                })
                .catch((error) => {
                    errorMsg.style.display = 'block';
                    errorMsg.innerText = "Sai tài khoản hoặc mật khẩu!";
                });
        } else {
            auth.createUserWithEmailAndPassword(email, password)
                .then((userCredential) => {
                    alert("Đăng ký thành công! Hệ thống đang tự động chuyển hướng.");
                    window.location.href = "dashboard.html";
                })
                .catch((error) => {
                    errorMsg.style.display = 'block';
                    errorMsg.innerText = "Mật khẩu tối thiểu 6 ký tự hoặc Email đã tồn tại!";
                });
        }
    });
</script>
</body>
</html>
