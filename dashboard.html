<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bảng Điều Khiển Trung Tâm Real-time</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --bg-color: #0f172a; --card-bg: #1e293b; --text-main: #f8fafc; --text-sub: #94a3b8; --color-normal: #10b981; --color-warning: #f59e0b; --color-danger: #ef4444; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); }
        
        .navbar { background: #1e293b; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; }
        .nav-brand { font-size: 18px; font-weight: bold; color: #38bdf8; text-transform: uppercase; }
        .nav-links a { color: var(--text-sub); text-decoration: none; margin-right: 20px; font-weight: 600; font-size: 15px; transition: 0.3s; }
        .nav-links a.active, .nav-links a:hover { color: #38bdf8; }
        .logout-btn { padding: 8px 15px; background: #334155; border: 1px solid #475569; border-radius: 6px; color: #ef4444; font-weight: 600; cursor: pointer; transition: 0.3s; }
        .logout-btn:hover { background: #ef4444; color: white; }

        .content-body { padding: 30px; }
        .container { display: grid; grid-template-columns: 1fr 1fr; gap: 25px; max-width: 1200px; margin: 0 auto; }
        @media (max-width: 768px) { .container { grid-template-columns: 1fr; } }

        .ai-panel { background: var(--card-bg); border-radius: 16px; padding: 30px; display: flex; flex-direction: column; align-items: center; justify-content: center; border: 1px solid #334155; }
        .ai-title { font-size: 16px; font-weight: bold; color: #38bdf8; margin-bottom: 25px; text-transform: uppercase; }
        .ai-circle { width: 220px; height: 220px; border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center; border: 8px solid var(--color-normal); box-shadow: 0 0 20px rgba(16, 185, 129, 0.2); transition: all 0.5s ease; background: #111827; }
        .ai-circle i { font-size: 45px; margin-bottom: 10px; color: var(--color-normal); }
        .ai-status-text { font-size: 20px; font-weight: 800; color: var(--color-normal); text-transform: uppercase; }
        
        @keyframes blink { 0%, 100% { box-shadow: 0 0 30px rgba(239, 68, 68, 0.6); opacity: 1; } 50% { box-shadow: 0 0 10px rgba(239, 68, 68, 0.2); opacity: 0.5; } }
        .critical-blink { animation: blink 0.8s infinite; }

        .grid-metrics { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .card { background: var(--card-bg); border-radius: 12px; padding: 20px; display: flex; flex-direction: column; justify-content: space-between; border: 1px solid #334155; }
        .card-header { display: flex; justify-content: space-between; align-items: center; color: var(--text-sub); font-size: 13px; font-weight: 600; }
        .card-value { font-size: 32px; font-weight: bold; margin-top: 10px; color: #ffffff; }
        .card-unit { font-size: 14px; color: var(--text-sub); font-weight: normal; }
        .full-width { grid-column: span 2; }
        .alert-active { background: #451a1a !important; border-color: var(--color-danger) !important; animation: shake 0.5s infinite; }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-2px); } 75% { transform: translateX(2px); } }
    </style>
</head>
<body>

    <div class="navbar">
        <div class="nav-brand"><i class="fa-solid fa-laptop-medical"></i> HỆ THỐNG Y TẾ AI REAL-TIME</div>
        <div class="nav-links">
            <a href="dashboard.html" class="active"><i class="fa-solid fa-chart-line"></i> Giám Sát</a>
            <a href="history.html"><i class="fa-solid fa-clock-history"></i> Lịch Sử Sự Cố</a>
        </div>
        <button class="logout-btn" id="btnLogout">Đăng Xuất</button>
    </div>

    <div class="content-body">
        <div class="container">
            <div class="ai-panel">
                <div class="ai-title"><i class="fa-solid fa-brain"></i> Trạng Thái Hô Hấp TinyML (AI)</div>
                <div class="ai-circle" id="aiCircle">
                    <i class="fa-solid fa-lungs" id="aiIcon"></i>
                    <div class="ai-status-text" id="aiStatus">Kết nối...</div>
                </div>
                <p style="margin-top: 20px; color: var(--text-sub); text-align: center; font-size: 13px;" id="aiDesc">Đang kết nối Realtime...</p>
            </div>

            <div class="grid-metrics">
                <div class="card">
                    <div class="card-header"><span>NỒNG ĐỘ OXY (SpO2)</span><i class="fa-solid fa-droplet" style="color: #38bdf8;"></i></div>
                    <div class="card-value" id="valSpO2">-- <span class="card-unit">%</span></div>
                </div>
                <div class="card">
                    <div class="card-header"><span>NHỊP TIM</span><i class="fa-solid fa-heartbeat" style="color: #ef4444;"></i></div>
                    <div class="card-value" id="valHeart">-- <span class="card-unit">BPM</span></div>
                </div>
                <div class="card full-width">
                    <div class="card-header"><span>TƯ THẾ NẰM LÂM SÀNG</span><i class="fa-solid fa-bed" style="color: #a78bfa;"></i></div>
                    <div class="card-value" id="valPos" style="font-size: 22px; color: #c084fc;">Đang xác định...</div>
                </div>
                <div class="card full-width" id="cardFall">
                    <div class="card-header"><span>CẢNH BÁO SỰ CỐ NGÃ</span><i class="fa-solid fa-person-walking-dashed-line" id="iconFall"></i></div>
                    <div class="card-value" id="valFall" style="font-size: 20px;">AN TOÀN</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAMuEApllbG1GIjUyKDdS2iA5aBgDXKFX0",
            authDomain: "he-thong-giam-sat-y-te.firebaseapp.com",
            databaseURL: "https://he-thong-giam-sat-y-te-default-rtdb.asia-southeast1.firebasedatabase.app/",
            projectId: "he-thong-giam-sat-y-te",
            storageBucket: "he-thong-giam-sat-y-te.firebasestorage.app",
            messagingSenderId: "364046979167",
            appId: "1:364046979167:web:30dc775a48fb4e51030bea"
        };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        const auth = firebase.auth();

        // Kiểm tra chặn truy cập trái phép
        auth.onAuthStateChanged(user => {
            if (!user) { window.location.href = "login.html"; }
        });

        document.getElementById('btnLogout').addEventListener('click', () => {
            auth.signOut().then(() => { window.location.href = "login.html"; });
        });

        // Đọc dữ liệu từ nút PatientMonitor
        database.ref('/PatientMonitor').on('value', (snapshot) => {
            const data = snapshot.val();
            if (data) {
                document.getElementById('valSpO2').innerHTML = `${data.SpO2} <span class="card-unit">%</span>`;
                document.getElementById('valHeart').innerHTML = `${data.HeartRate} <span class="card-unit">BPM</span>`;
                document.getElementById('valPos').innerText = data.TuThe;

                const cardFall = document.getElementById('cardFall');
                const valFall = document.getElementById('valFall');
                if (data.CanhBaoNga === true) {
                    cardFall.classList.add('alert-active');
                    valFall.innerText = "CẢNH BÁO: PHÁT HIỆN BỆNH NHÂN NGÃ!";
                    valFall.style.color = "#ef4444";
                } else {
                    cardFall.classList.remove('alert-active');
                    valFall.innerText = "AN TOÀN";
                    valFall.style.color = "#10b981";
                }

                const aiCircle = document.getElementById('aiCircle');
                const aiIcon = document.getElementById('aiIcon');
                const aiStatus = document.getElementById('aiStatus');
                const aiDesc = document.getElementById('aiDesc');
                const aiLabel = parseInt(data.TrangThaiTho_AI);

                aiCircle.classList.remove('critical-blink');

                if (aiLabel === 0) {
                    aiCircle.style.borderColor = "#10b981"; aiIcon.style.color = "#10b981"; aiStatus.style.color = "#10b981";
                    aiStatus.innerText = "BÌNH THƯỜNG"; aiDesc.innerText = "AI nhận diện: Nhịp sóng thở đều đặn và ổn định.";
                } else if (aiLabel === 1) {
                    aiCircle.style.borderColor = "#f59e0b"; aiIcon.style.color = "#f59e0b"; aiStatus.style.color = "#f59e0b";
                    aiStatus.innerText = "CẢNH BÁO SỚM"; aiDesc.innerText = "AI nhận diện: Phát hiện nhịp sóng dốc, rặn thở gấp!";
                } else if (aiLabel === 2) {
                    aiCircle.style.borderColor = "#ef4444"; aiIcon.style.color = "#ef4444"; aiStatus.style.color = "#ef4444";
                    aiCircle.classList.add('critical-blink');
                    aiStatus.innerText = "NGƯNG THỞ!"; aiDesc.innerText = "AI CẢNH BÁO: Lồng ngực bất động, xuất hiện rung cơ tim!";
                }
            }
        });
    </script>
</body>
</html>
